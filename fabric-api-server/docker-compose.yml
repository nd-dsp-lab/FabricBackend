services:
  fabric-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8080"
    environment:
      - ENV=development
      - CRYPTO_PATH=/fabric-samples/test-network/organizations/peerOrganizations/org1.example.com
      - PEER_ENDPOINT=dns:///localhost:7051
    volumes:
      - ./src:/app/src
      - ../fabric-samples:/fabric-samples
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  couchdb_data: